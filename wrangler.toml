# GENERATED by app_builder (create-app / sync). Do not edit: change app.config.json
# or app_builder/platform.config.json, then run sync.
#
# Cloudflare Access protects apps.example.com as ONE hostname-based application covering every path.
# Never use the Worker-level "Protect this Worker" toggle: it rejects WebSocket upgrades.
# No other way in may exist, so workers.dev and preview URLs stay off.
name = "app-asl-translator"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

workers_dev = false
preview_urls = false
send_metrics = false

routes = [
  { pattern = "apps.example.com/asl-translator", zone_name = "example.com" },
  { pattern = "apps.example.com/asl-translator/*", zone_name = "example.com" },
]

# Not secrets: the team name and AUD tag appear in every login token.
[vars]
TEAM = ""
ACCESS_AUD = ""
ALLOWED_EMAILS = ""

[assets]
directory = "dist/friends"
binding = "ASSETS"
# The Worker (and its Access check) runs before every asset: nothing is served unauthenticated.
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "RUNS"
class_name = "SoloRun"

# Shared across every app: the account-wide usage meter and the scoreboards live in the platform Worker.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageMeter"
script_name = "app-platform"

[[durable_objects.bindings]]
name = "SCORES"
class_name = "Scores"
script_name = "app-platform"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "SoloRun"]
